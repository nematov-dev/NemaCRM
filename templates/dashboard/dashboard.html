{% extends 'page/base.html' %}
{% load static %}

{% block title %}NemaCRM{% endblock title %}

{% block content %}
<div class="container-fluid">
  <!-- ========== title-wrapper start ========== -->
  <div class="title-wrapper pt-30">
    <div class="row align-items-center">
      <div class="col-md-6">
        <div class="title">
          <h2>Barcha mahsulotlar</h2>
        </div>
      </div>
      
      <!-- 🔽 Filtrlar: Kategoriya -->
      <form method="get" id="filterForm">
        <div class="row mb-0">
          <div class="col-md-6">
            <div class="row align-items-center g-2">
              <!-- Kategoriya -->
              <div class="col-auto d-flex align-items-center gap-2">
                <label style="color: rgb(30, 28, 28);" for="category" class="fw-bold mb-0">Kategoriya:</label>
                <select name="category" id="filterCategory" class="form-select form-select-sm" style="width: auto;" onchange="document.getElementById('filterForm').submit();">
                  <option value="">Barchasi</option>
                  {% for cat in categories %}
                    <option value="{{ cat.id }}" {% if request.GET.category == cat.id|stringformat:"s" %}selected{% endif %}>{{ cat.name }}</option>
                  {% endfor %}
                </select>
              </div>
    
            </div>
          </div>
        </div>
      </form>

    </div>
    <!-- end row -->
  </div>

    <!-- 🔍 Qidiruv formasi -->
    <div class="row mt-0 mb-3 justify-content-center">
      <div class="col-12 col-md-6">
        <form class="search-form" method="GET" action="">
          <div class="input-group">
            <input id="searchProducts" type="text" class="form-control rounded-start-pill py-3 px-4 fs-9" name="product-search" placeholder="Mahsulot nomi bo‘yicha qidiring...">
            <button class="btn btn-primary rounded-end-pill px-4 fs-5" type="submit">Qidirish</button>
          </div>
        </form>
      </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
      $(document).ready(function() {
        function filterProducts() {
          let query = $('#searchProducts').val();
          let category = $('#filterCategory').val();

          $.ajax({
            url: "{% url 'app_dashboard:dashboard' %}",
            data: {
              'product-search': query,
              'category': category,
            },
            success: function(data) {
              $('#dashboard-list').html(data);
            },
            error: function(xhr, status, error) {
              console.log("Xatolik:", error);
            }
          });
        }

        // Har bir filter o‘zgarganda ishga tushadi
        $('#searchProducts').on('input', filterProducts);
        $('#filterCategory').on('change', filterProducts);
      });
    </script>

    <!-- 🔍 Qidiruv formasi tugadi -->

  <div id="dashboard-list">
    {% include "dashboard/_dashboard.html" %}
  </div>
{% endblock content %}
