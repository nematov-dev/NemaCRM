{% extends 'page/base.html' %}
{% load static %}

{% block title %}Category Detail{% endblock title %}

{% block content %}
<div class="container my-5">
  {% if messages %}
  {% for message in messages %}
    <div class="alert alert-success alert-dismissible fade show" role="alert">
      {{ message }}
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
  {% endfor %}
{% endif %}
  <div class="card shadow-sm border-0">
    <div class="card-body">
      <h4 class="mb-4">📝 Kategoriyani tahrirlash</h4>

      <form method="post" >
        {% csrf_token %}
        <!-- Mahsulot nomi -->
        <div class="mb-3">
          <label for="name" class="form-label">Kategoriya nomi</label>
          <input name="name" type="text" class="form-control" id="name" value="{{ category.name }}">
        </div>

        <!-- Tugmalar -->
        <button type="submit" class="btn btn-success">Saqlash</button>
        <a href="{% url 'app_category:category-list' %}" class="btn btn-secondary">Orqaga</a>
      </form>
    </div>
  </div>
</div>
{% endblock content %}
