{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <link rel="shortcut icon" href="{% static 'assets/images/logo/crm.png' %}" type="image/x-icon" />
  <title>Forget Password</title>
  <link rel="stylesheet" href="{% static 'assets/css/main.css' %}" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a2d9d5bc54.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    body {
      background: linear-gradient(135deg, #e3f2fd, #ffffff);
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background-color: #ffffff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      animation: fadeIn 1.2s ease;
    }

    .login-icon {
      font-size: 60px;
      color: #0d6efd;
      animation: bounce 1.5s ease infinite alternate;
    }

    .form-control {
      border-radius: 10px;
      transition: all 0.3s ease;
    }

    .form-control:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
    }

    .btn-primary {
      border-radius: 10px;
      font-weight: 500;
      transition: background-color 0.3s ease;
    }

    .btn-primary:hover {
      background-color: #0b5ed7;
    }

    .forgot-password a {
      text-decoration: none;
      color: #6c757d;
      font-size: 14px;
      transition: color 0.3s ease;
    }

    .forgot-password a:hover {
      color: #0d6efd;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-5px); }
    }
  </style>
</head>
<body>

  <div class="login-box">
    <div class="text-center mb-4">
      <i class="fas fa-lock login-icon"></i>
      <h3 class="mt-3 fw-bold">Parolni tiklash</h3>
    </div>

    {% if messages %}
    {% for message in messages %}
      <!-- Modal -->
      <div class="modal fade" id="successModal" tabindex="-1" aria-labelledby="successModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="successModalLabel"></h5>
            </div>
            <div class="modal-body text-center">
              <span style="color: green; font-weight: bold;"  >{{ message }}</span>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-primary"
                onclick="window.location.href='{% url 'app_auth:login' %}'">OK</button>
            </div>
          </div>
        </div>
      </div>
  
      <script>
        document.addEventListener("DOMContentLoaded", function() {
          var modal = new bootstrap.Modal(document.getElementById('successModal'));
          modal.show();
        });
      </script>
    {% endfor %}
  {% endif %}
  

    <form method="POST">
      {% csrf_token %}

      <div class="mb-3">
        <label for="new_password1" class="form-label">Yangi parol</label>
        <input type="password" name="new_password1" id="new_password1" class="form-control" placeholder="Yangi parolni kiriting" required>
      </div>
      <div class="mb-3">
        <label for="new_password2" class="form-label">Yangi tasdiq parol</label>
        <input type="password" name="new_password2" id="new_password2" class="form-control" placeholder="Yangi tasdiq parolni kiriting" required>
      </div>

      <style>
        .no-underline {
          text-decoration: none;
        }
      </style>
      
      <button type="submit" class="btn btn-primary w-100">Tasdiqlash</button>
    </form>
  </div>

</body>
</html>
