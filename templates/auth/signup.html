{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- Mobil moslashuv -->
  <link rel="shortcut icon" href="{% static 'assets/images/logo/crm.png' %}" type="image/x-icon" />
  <title>Ro'yxatdan o'tish</title>
  <link rel="stylesheet" href="{% static 'assets/css/main.css' %}" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a2d9d5bc54.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    body {
      background: linear-gradient(135deg, #e3f2fd, #ffffff);
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px; /* Kichik ekranlarda bo'sh joy */
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background-color: #ffffff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      animation: fadeIn 1.2s ease;
    }

    .login-icon {
      font-size: 60px;
      color: #0d6efd;
      animation: bounce 1.5s ease infinite alternate;
    }

    .form-control {
      border-radius: 10px;
      transition: all 0.3s ease;
    }

    .form-control:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
    }

    .btn-primary {
      border-radius: 10px;
      font-weight: 500;
      transition: background-color 0.3s ease;
    }

    .btn-primary:hover {
      background-color: #0b5ed7;
    }

    .forgot-password a {
      text-decoration: none;
      color: #6c757d;
      font-size: 14px;
      transition: color 0.3s ease;
    }

    .forgot-password a:hover {
      color: #0d6efd;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-5px); }
    }

    /* Mobil moslashuv */
    @media (max-width: 576px) {
      .login-box {
        padding: 20px;
      }
      .login-icon {
        font-size: 45px;
      }
      h3 {
        font-size: 20px;
      }
      .form-control {
        font-size: 14px;
        padding: 10px;
      }
      .btn-primary {
        font-size: 14px;
        padding: 10px;
      }
    }
  </style>
</head>
<body>

  <div class="login-box">
    <div class="text-center mb-4">
      <i class="fas fa-lock login-icon"></i>
      <h3 class="mt-3 fw-bold">Ro'yxatdan o'tish</h3>
    </div>

    <form method="POST">
      {% csrf_token %}

      {% if form.errors %}
        <div class="alert alert-danger">
          <ul class="mb-0">
            {% for field in form %}
              {% for error in field.errors %}
                <li>{{ error }}</li>
              {% endfor %}
            {% endfor %}
            {% for error in form.non_field_errors %}
              <li>{{ error }}</li>
            {% endfor %}
          </ul>
        </div>
      {% endif %}

      <div class="mb-3">
        <label for="first_name" class="form-label">Ism</label>
        <input type="text" name="first_name" id="first_name" class="form-control" placeholder="Ismingizni kiriting" required>
      </div>
      <div class="mb-3">
        <label for="last_name" class="form-label">Familiya</label>
        <input type="text" name="last_name" id="last_name" class="form-control" placeholder="Familiyangizni kiriting" required>
      </div>
      <div class="mb-3">
        <label for="phone" class="form-label">Telefon raqam</label>
        <input type="text" name="phone" id="phone" class="form-control" value="{{ request.session.phone }}" readonly required>
      </div>
      <div class="mb-3">
        <label for="password1" class="form-label">Parol</label>
        <input type="password" name="password1" id="password1" class="form-control" placeholder="Parolingizni kiriting" required>
      </div>
      <div class="mb-3">
        <label for="password2" class="form-label">Tasdiq parol</label>
        <input type="password" name="password2" id="password2" class="form-control" placeholder="Parolingizni tasdiqlang" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Ro'yxatdan o'tish</button>
    </form>
  </div>
  

</body>
</html>
